services:
  - type: web
    name: lextrust
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lextrust-db
          property: connectionString
      - key: DATABASE_SSL
        value: true
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_WEBSITE_URL
        value: https://lextrust.sa
      - key: STORAGE_DRIVER
        value: s3
      - key: OWNER_USERNAME
        value: owner
      - key: OWNER_CONTACT
        value: lex.trust.sa@gmail.com
      - key: OWNER_PASSWORD
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: lextrust-db
    plan: basic-256mb
